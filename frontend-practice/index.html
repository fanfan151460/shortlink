<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS短链系统</title>
<style>
:root {
  --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f1f5f9; --card: #fff;
  --text: #1e293b; --text2: #64748b; --border: #e2e8f0; --danger: #ef4444;
  --success: #22c55e; --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
/* ===== Auth ===== */
.auth-wrap { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.auth-card { background:var(--card); border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); width:400px; overflow:hidden; }
.auth-tabs { display:flex; border-bottom:1px solid var(--border); }
.auth-tabs button { flex:1; padding:14px; border:none; background:none; font-size:15px; cursor:pointer; color:var(--text2); transition:.15s; }
.auth-tabs button.active { color:var(--primary); border-bottom:2px solid var(--primary); font-weight:600; }
.auth-body { padding:28px; }
.auth-body h1 { font-size:20px; text-align:center; margin-bottom:20px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; color:var(--text2); margin-bottom:4px; }
.form-group input { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; outline:none; transition:.15s; }
.form-group input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.1); }
.form-group .hint { font-size:12px; margin-top:4px; }
.form-group .hint.ok { color:var(--success); }
.form-group .hint.err { color:var(--danger); }
.auth-body .btn { width:100%; padding:10px; border:none; border-radius:6px; font-size:14px; cursor:pointer; background:var(--primary); color:#fff; font-weight:500; }
.auth-body .btn:hover { background:var(--primary-hover); }
.auth-body .btn:disabled { opacity:.5; cursor:not-allowed; }
.auth-body .error { color:var(--danger); font-size:13px; text-align:center; margin-top:8px; }
/* ===== Layout ===== */
.app { display:flex; height:100vh; }
.sidebar { width:250px; background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.sidebar-header .brand { font-size:16px; font-weight:700; color:var(--primary); }
.sidebar-body { flex:1; overflow-y:auto; padding:8px 0; }
.sidebar-body .section-label { font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; padding:8px 20px 4px; }
.group-item { display:flex; align-items:center; justify-content:space-between; padding:9px 20px; cursor:pointer; font-size:14px; border-left:3px solid transparent; transition:.12s; }
.group-item:hover { background:#f8fafc; }
.group-item.active { background:#eef2ff; border-left-color:var(--primary); color:var(--primary); font-weight:500; }
.group-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.group-item .del { color:#cbd5e1; font-size:16px; cursor:pointer; border:none; background:none; padding:0 4px; visibility:hidden; }
.group-item:hover .del { visibility:visible; }
.group-item .del:hover { color:var(--danger); }
.sidebar-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:6px; }
.sidebar-footer input { flex:1; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
.sidebar-footer input:focus { border-color:var(--primary); }
.sidebar-footer button { padding:7px 14px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap; }
.sidebar-footer button:hover { background:var(--primary-hover); }
/* ===== Main ===== */
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar { padding:0 24px; height:56px; background:var(--card); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.topbar .breadcrumb { font-size:14px; color:var(--text2); }
.topbar .breadcrumb span { color:var(--text); font-weight:500; }
.topbar .actions { display:flex; align-items:center; gap:12px; }
.topbar .btn-outline { padding:6px 16px; border:1px solid var(--border); border-radius:6px; background:#fff; font-size:13px; cursor:pointer; }
.topbar .btn-outline:hover { background:#f8fafc; }
.topbar .btn-outline.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.topbar .user { font-size:13px; color:var(--text2); }
.topbar .logout { font-size:13px; color:var(--text2); cursor:pointer; background:none; border:none; margin-left:4px; }
.topbar .logout:hover { color:var(--danger); }
.content { flex:1; padding:24px; overflow-y:auto; }
.empty-state { text-align:center; padding:80px 0; color:var(--text2); }
.empty-state .icon { font-size:40px; margin-bottom:12px; }
/* ===== Toolbar ===== */
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.toolbar .btn-primary { padding:8px 20px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; font-weight:500; }
.toolbar .btn-primary:hover { background:var(--primary-hover); }
.toolbar .stats-summary { display:flex; gap:16px; font-size:13px; color:var(--text2); }
/* ===== Table ===== */
.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead { background:#f8fafc; }
th { padding:10px 14px; text-align:left; font-weight:500; color:var(--text2); font-size:12px; text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px 14px; border-bottom:1px solid #f1f5f9; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#fafbff; }
td.url { font-family:"SF Mono",Monaco,monospace; color:var(--primary); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
td.origin { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
td.stats { font-variant-numeric:tabular-nums; }
td.stats .today { font-size:11px; color:var(--text2); }
.favicon-img { width:16px; height:16px; vertical-align:middle; margin-right:6px; border-radius:2px; }
.actions-cell { white-space:nowrap; }
.actions-cell button { padding:4px 10px; border-radius:4px; font-size:12px; cursor:pointer; border:1px solid var(--border); background:#fff; margin-right:4px; }
.actions-cell button:hover { background:#f1f5f9; }
.actions-cell button.danger { color:var(--danger); border-color:var(--danger); }
.actions-cell button.danger:hover { background:#fef2f2; }
.pagination { display:flex; justify-content:center; align-items:center; gap:8px; padding:16px; font-size:13px; }
.pagination button { padding:5px 12px; border:1px solid var(--border); border-radius:4px; background:#fff; cursor:pointer; }
.pagination button:hover { background:#f1f5f9; }
.pagination button:disabled { opacity:.4; cursor:default; }
.pagination .page-num { color:var(--text2); }
/* ===== Drawer ===== */
.drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:200; display:none; }
.drawer-overlay.show { display:block; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:640px; background:var(--card); z-index:201; transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; box-shadow:-4px 0 24px rgba(0,0,0,.08); }
.drawer.show { transform:translateX(0); }
.drawer-header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.drawer-header h3 { font-size:16px; }
.drawer-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text2); padding:4px; }
.drawer-close:hover { color:var(--text); }
.drawer-body { flex:1; overflow-y:auto; padding:16px 24px; }
.drawer-body table { font-size:12px; }
.drawer-body th { font-size:11px; }
.drawer-body td { font-size:12px; }
.log-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; background:#eef2ff; color:var(--primary); }
/* ===== Modal ===== */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:100; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card); border-radius:12px; padding:28px; width:500px; max-height:90vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,.12); }
.modal h3 { margin-bottom:20px; font-size:17px; }
.modal .form-group label { display:block; font-size:13px; color:var(--text2); margin:12px 0 4px; }
.modal .form-group input, .modal .form-group select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
.modal .form-group input:focus, .modal .form-group select:focus { border-color:var(--primary); }
.modal-actions { margin-top:20px; display:flex; gap:8px; justify-content:flex-end; }
.modal-actions button { padding:8px 18px; border-radius:6px; font-size:13px; cursor:pointer; }
.modal-actions .btn-cancel { background:#fff; border:1px solid var(--border); }
.modal-actions .btn-confirm { background:var(--primary); color:#fff; border:none; }
.modal-actions .btn-confirm:hover { background:var(--primary-hover); }
/* ===== Toast ===== */
.toast { position:fixed; top:20px; right:20px; padding:10px 20px; border-radius:6px; font-size:14px; color:#fff; z-index:300; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }
.toast.success { background:var(--success); }
.toast.error { background:var(--danger); }
.toast.info { background:var(--primary); }
/* ===== Stats ===== */
.stats-overlay { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:200; display:none; }
.stats-overlay.show { display:flex; justify-content:center; align-items:flex-start; }
.stats-panel { background:var(--card); border-radius:12px; width:94vw; max-width:1200px; height:90vh; margin-top:3vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,.12); overflow:hidden; }
.stats-panel-header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.stats-panel-header h3 { font-size:16px; }
.stats-panel-header .link-info { font-size:12px; color:var(--primary); margin-left:12px; font-family:monospace; }
.stats-panel-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text2); }
.stats-panel-close:hover { color:var(--text); }
.stats-toolbar { padding:10px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; flex-shrink:0; }
.stats-toolbar .preset-btn { padding:5px 14px; border:1px solid var(--border); border-radius:14px; font-size:12px; cursor:pointer; background:#fff; color:var(--text2); transition:.15s; }
.stats-toolbar .preset-btn:hover { border-color:var(--primary); color:var(--primary); }
.stats-toolbar .preset-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.stats-toolbar input[type="date"] { padding:5px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; outline:none; }
.stats-toolbar input[type="date"]:focus { border-color:var(--primary); }
.stats-toolbar .spacer { flex:1; }
.stats-body { flex:1; overflow-y:auto; padding:16px 24px 24px; }
.stats-loading { text-align:center; padding:60px; color:var(--text2); }
.stats-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
.stats-grid .chart-card { background:var(--bg); border-radius:var(--radius); padding:14px; min-height:260px; display:flex; flex-direction:column; }
.stats-grid .chart-card h4 { font-size:13px; color:var(--text2); margin-bottom:8px; }
.stats-grid .chart-card canvas { flex:1; max-height:220px; }
.stats-row-full { margin-top:16px; }
.stats-row-full .chart-card { background:var(--bg); border-radius:var(--radius); padding:14px; min-height:280px; }
.stats-row-full .chart-card h4 { font-size:13px; color:var(--text2); margin-bottom:8px; }
.stats-row-full .chart-card canvas { max-height:240px; }
.stats-empty { text-align:center; padding:40px; color:var(--text2); font-size:13px; }
</style>
</head>
<body>
<!-- ======================== AUTH ======================== -->
<div id="authPage" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">登录</button>
      <button id="tabRegister" onclick="switchAuthTab('register')">注册</button>
    </div>
    <div class="auth-body">
      <h1>SaaS短链系统</h1>
      <!-- 登录表单 -->
      <form id="loginForm">
        <div class="form-group"><label>用户名</label><input name="username" required placeholder="输入用户名"></div>
        <div class="form-group"><label>密码</label><input name="password" type="password" required placeholder="输入密码"></div>
        <button type="submit" class="btn">登录</button>
        <div class="error" id="loginError"></div>
      </form>
      <!-- 注册表单 -->
      <form id="registerForm" style="display:none">
        <div class="form-group"><label>用户名</label><input name="rusername" required placeholder="输入用户名" autocomplete="off"><div class="hint" id="nameHint"></div></div>
        <div class="form-group"><label>密码</label><input name="rpassword" type="password" required placeholder="至少6位"></div>
        <div class="form-group"><label>真实姓名</label><input name="realName" placeholder="可选"></div>
        <div class="form-group"><label>手机号</label><input name="phone" placeholder="可选"></div>
        <div class="form-group"><label>邮箱</label><input name="mail" placeholder="可选"></div>
        <button type="submit" class="btn" id="regBtn">注册</button>
        <div class="error" id="regError"></div>
      </form>
    </div>
  </div>
</div>
<!-- ======================== APP ======================== -->
<div id="appPage" class="app" style="display:none">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header"><span class="brand">SaaS短链系统</span></div>
    <div class="sidebar-body">
      <div class="section-label">我的分组</div>
      <div id="groupList"><div style="padding:20px;color:var(--text2);font-size:13px;">加载中...</div></div>
    </div>
    <div class="sidebar-footer">
      <input id="newGroupInput" placeholder="新建分组" maxlength="20">
      <button onclick="createGroup()">新建</button>
    </div>
  </div>
  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb"><span id="viewTitle">短链接管理</span></div>
      <div class="actions">
        <button class="btn-outline" id="btnLinks" onclick="switchView('links')">短链接</button>
        <button class="btn-outline" id="btnRecycle" onclick="switchView('recycle')">回收站</button>
        <span class="user" id="topUser"></span>
        <button class="logout" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<!-- ======================== MODAL ======================== -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h3 id="modalTitle">创建短链接</h3>
    <form id="linkForm">
      <div class="form-group"><label>原始链接</label><div style="display:flex;gap:6px;"><input name="originUrl" required placeholder="https://..." style="flex:1"><button type="button" class="btn-cancel" onclick="fetchTitle()" style="white-space:nowrap;font-size:12px;padding:8px 12px;">获取标题</button></div></div>
      <div class="form-group"><label>有效期类型</label><select name="validDateType"><option value="0">永久有效</option><option value="1">自定义日期</option></select></div>
      <div class="form-group" id="validDateGroup" style="display:none"><label>有效期</label><input name="validDate" type="datetime-local"></div>
      <div class="form-group"><label>描述</label><input name="description" placeholder="可选描述"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-confirm">确认</button>
      </div>
    </form>
  </div>
</div>
<!-- ======================== DRAWER (访问日志) ======================== -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3>访问记录</h3>
    <button class="drawer-close" onclick="closeDrawer()">&times;</button>
  </div>
  <div style="padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg);">
    <input type="date" id="logStart" style="width:140px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;" placeholder="开始日期">
    <span style="color:var(--text2);">—</span>
    <input type="date" id="logEnd" style="width:140px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;" placeholder="结束日期">
    <button onclick="logFilter()" style="padding:6px 16px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;">筛选</button>
    <button onclick="logReset()" style="padding:6px 12px;background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:pointer;">重置</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="pagination" id="drawerPager"></div>
</div>
<!-- ======================== STATS PANEL ======================== -->
<div class="stats-overlay" id="statsOverlay">
  <div class="stats-panel">
    <div class="stats-panel-header">
      <div><h3 style="display:inline">数据统计</h3><span class="link-info" id="statsLinkUrl"></span></div>
      <button class="stats-panel-close" onclick="closeStats()">&times;</button>
    </div>
    <div class="stats-toolbar" id="statsToolbar">
      <button class="preset-btn active" onclick="statsPreset(7, this)">近7天</button>
      <button class="preset-btn" onclick="statsPreset(30, this)">近30天</button>
      <button class="preset-btn" onclick="statsPreset(90, this)">近90天</button>
      <span class="spacer"></span>
      <input type="date" id="statsStart"> <span style="font-size:12px;color:var(--text2);">—</span>
      <input type="date" id="statsEnd">
      <button class="preset-btn" onclick="statsCustom()">自定义查询</button>
    </div>
    <div class="stats-body" id="statsBody">
      <div class="stats-loading">请选择一条短链接查看统计数据</div>
    </div>
  </div>
</div>
<!-- ======================== TOAST ======================== -->
<div class="toast" id="toast"></div>
<script>
const BASE = 'http://127.0.0.1:8000/api/short-link/admin/v1';
let token = '', username = '', groups = [], currentGid = '', currentView = 'links';
let page = 1, hasMore = false, recyclePage = 1, recycleHasMore = false;
let logShortUrl = '', logGid = '', logPage = 1, logHasMore = false, logStart = '', logEnd = '';
let statsShortUrl = '', statsGid = '', statsCharts = [];
// ================ utils ================
function hdrs() { return {'Content-Type':'application/json', username, token}; }
function toast(msg, type) { var e=document.getElementById('toast'); e.textContent=msg; e.className='toast '+type+' show'; clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('show');},2000); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escQ(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fmtDate(d) { if(!d) return '-'; return d.split('T')[0] || d.split(' ')[0] || d; }
function faviconUrl(url) { try { var u=new URL(url); return u.origin+'/favicon.ico'; } catch(e) { return ''; } }
// ================ auth tabs ================
function switchAuthTab(tab) {
  var isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
}
// ================ login ================
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var u = this.username.value, p = this.password.value;
  document.getElementById('loginError').textContent = '';
  try {
    var r = await fetch(BASE+'/user/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    var j = await r.json();
    if (j.code==='0') { token=j.data.token; username=u; saveSession(); enterApp(); }
    else document.getElementById('loginError').textContent = j.message||'登录失败';
  } catch(e) { document.getElementById('loginError').textContent = '网络错误: '+e.message; }
});
// ================ register (with username check) ================
var nameCheckTimer;
document.forms.registerForm.rusername.addEventListener('input', function() {
  clearTimeout(nameCheckTimer);
  var name = this.value.trim(), hint = document.getElementById('nameHint');
  if (!name) { hint.textContent=''; hint.className='hint'; return; }
  if (name.length < 3) { hint.textContent='用户名至少3位'; hint.className='hint err'; return; }
  nameCheckTimer = setTimeout(async function() {
    try {
      var r = await fetch(BASE+'/user/has-username?username='+encodeURIComponent(name));
      var j = await r.json();
      if (j.code==='0') { hint.textContent = j.data ? '用户名可用' : '用户名已被占用'; hint.className = 'hint '+(j.data?'ok':'err'); }
    } catch(e) { hint.textContent='检测失败'; hint.className='hint err'; }
  }, 400);
});
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var body = { username:this.rusername.value, password:this.rpassword.value, realName:this.realName.value, phone:this.phone.value, mail:this.mail.value };
  document.getElementById('regError').textContent = '';
  if (body.password.length < 6) { document.getElementById('regError').textContent='密码至少6位'; return; }
  try {
    var r = await fetch(BASE+'/user', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j = await r.json();
    if (j.code==='0') { toast('注册成功，请登录','success'); switchAuthTab('login'); document.forms.loginForm.username.value=body.username; this.reset(); document.getElementById('nameHint').textContent=''; }
    else document.getElementById('regError').textContent = j.message||'注册失败';
  } catch(e) { document.getElementById('regError').textContent = '网络错误: '+e.message; }
});
// ================ session ================
function saveSession() { localStorage.setItem('sl_token',token); localStorage.setItem('sl_username',username); }
function clearSession() { localStorage.removeItem('sl_token'); localStorage.removeItem('sl_username'); token=''; username=''; }
async function restoreSession() {
  var t = localStorage.getItem('sl_token'), u = localStorage.getItem('sl_username');
  if (!t||!u) return;
  try {
    var r = await fetch(BASE+'/user/check-login?username='+u+'&token='+t);
    var j = await r.json();
    if (j.code==='0') { token=t; username=u; enterApp(); }
    else clearSession();
  } catch(e) {}
}
function enterApp() {
  document.getElementById('authPage').style.display='none';
  document.getElementById('appPage').style.display='flex';
  document.getElementById('topUser').textContent = username;
  loadGroups();
}
function logout() { clearSession(); document.getElementById('appPage').style.display='none'; document.getElementById('authPage').style.display='flex'; currentGid=''; }
// ================ groups ================
async function loadGroups() {
  try {
    var r = await fetch(BASE+'/group',{headers:hdrs()}); var j = await r.json();
    if (j.code==='0') { groups=j.data; renderGroups(); }
  } catch(e) {}
}
function renderGroups() {
  var el = document.getElementById('groupList');
  if (!groups.length) { el.innerHTML='<div style="padding:20px;color:var(--text2);font-size:13px;">暂无分组</div>'; return; }
  el.innerHTML = groups.map(function(g) {
    return '<div class="group-item'+(g.gid===currentGid&&currentView==='links'?' active':'')+'" onclick="selectGroup(\''+escQ(g.gid)+'\')"><span class="name">'+esc(g.name)+'</span><button class="del" onclick="event.stopPropagation();delGroup(\''+escQ(g.gid)+'\')">&times;</button></div>';
  }).join('');
}
function selectGroup(gid) { currentGid=gid; page=1; renderGroups(); switchView('links'); loadLinks(); }
async function createGroup() {
  var inp=document.getElementById('newGroupInput'), name=inp.value.trim();
  if(!name) return toast('请输入分组名称','error');
  try {
    var r=await fetch(BASE+'/group',{method:'POST',headers:hdrs(),body:JSON.stringify({name})});
    var j=await r.json();
    if(j.code==='0'){inp.value='';toast('分组创建成功','success');loadGroups();}
    else toast(j.message||'创建失败','error');
  }catch(e){toast('网络错误','error');}
}
async function delGroup(gid) {
  if(!confirm('确定删除该分组？')) return;
  try {
    var r=await fetch(BASE+'/group?gid='+gid,{method:'DELETE',headers:hdrs()}); var j=await r.json();
    if(j.code==='0'){if(currentGid===gid){currentGid='';document.getElementById('content').innerHTML='<div class="empty-state"><div class="icon">&#128194;</div><p>请从左侧选择一个分组</p></div>';}toast('已删除','success');loadGroups();}
    else toast(j.message||'删除失败','error');
  }catch(e){toast('网络错误','error');}
}
// ================ view switcher ================
function switchView(view) {
  currentView = view;
  document.getElementById('btnLinks').classList.toggle('active', view==='links');
  document.getElementById('btnRecycle').classList.toggle('active', view==='recycle');
  renderGroups();
  if (view==='links') {
    document.getElementById('viewTitle').textContent = currentGid ? (groups.find(function(g){return g.gid===currentGid})||{}).name||'短链接管理' : '短链接管理';
    if (currentGid) loadLinks(); else document.getElementById('content').innerHTML='<div class="empty-state"><div class="icon">&#128194;</div><p>请从左侧选择一个分组</p></div>';
  } else {
    document.getElementById('viewTitle').textContent = '回收站';
    recyclePage=1; loadRecycle();
  }
}
// ================ shortlink list ================
async function loadLinks() {
  if(!currentGid||currentView!=='links') return;
  document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px;color:var(--text2);">加载中...</div>';
  try {
    var r=await fetch(BASE+'/page?gid='+currentGid+'&current='+page+'&size=10',{headers:hdrs()}); var j=await r.json();
    if(j.code==='0'){hasMore=j.data.length>=10;renderLinks(j.data);}
    else document.getElementById('content').innerHTML='<div class="empty-state"><p>加载失败: '+(j.message||'')+'</p></div>';
  }catch(e){document.getElementById('content').innerHTML='<div class="empty-state"><p>网络错误</p></div>';}
}
function renderLinks(links) {
  document.getElementById('viewTitle').textContent = (groups.find(function(g){return g.gid===currentGid})||{}).name||'短链接管理';
  var h='<div class="toolbar"><button class="btn-primary" onclick="openCreate()">+ 创建短链接</button></div>';
  if(!links||!links.length){ h+='<div class="empty-state"><p>此分组暂无短链接</p></div>'; document.getElementById('content').innerHTML=h; return; }
  h+='<div class="card"><table><thead><tr><th>短链接</th><th>原始链接</th><th>描述</th><th>今日PV/UV/IP</th><th>历史PV/UV/IP</th><th style="width:210px">操作</th></tr></thead><tbody>';
  links.forEach(function(l){
    var fv=faviconUrl(l.originUrl);
    h+='<tr>'
      +'<td class="url"><img class="favicon-img" src="'+fv+'" onerror="this.style.display=\'none\'">'+esc(l.fullShortUrl)+'</td>'
      +'<td class="origin" title="'+esc(l.originUrl)+'">'+esc(l.originUrl)+'</td>'
      +'<td>'+esc(l.description||'-')+'</td>'
      +'<td class="stats">'+(l.todayPv||0)+' / '+(l.todayUv||0)+' / '+(l.todayIpCount||0)+'</td>'
      +'<td class="stats">'+(l.totalPv||0)+' / '+(l.totalUv||0)+' / '+(l.totalUip||0)+'</td>'
      +'<td class="actions-cell">'
      +'<button onclick="openEdit(\''+escQ(l.fullShortUrl)+'\',\''+escQ(l.originUrl)+'\',\''+escQ(l.description||'')+'\')">编辑</button>'
      +'<button onclick="openStats(\''+escQ(l.fullShortUrl)+'\',\''+escQ(currentGid)+'\')">统计</button>'
      +'<button onclick="openLogs(\''+escQ(l.fullShortUrl)+'\',\''+escQ(currentGid)+'\')">访问记录</button>'
      +'<button class="danger" onclick="removeLink(\''+escQ(l.fullShortUrl)+'\')">删除</button>'
      +'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="pagination"><button onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>上一页</button><span class="page-num">第 '+page+' 页</span><button onclick="goPage('+(page+1)+')" '+(!hasMore?'disabled':'')+'>下一页</button></div>';
  document.getElementById('content').innerHTML=h;
}
function goPage(p){if(p<1)return;page=p;loadLinks();}
// ================ create / edit modal ================
var editingUrl='';
function openCreate() {
  editingUrl=''; document.getElementById('modalTitle').textContent='创建短链接';
  document.forms.linkForm.reset(); document.getElementById('validDateGroup').style.display='none';
  document.getElementById('linkModal').classList.add('show');
}
function openEdit(fullShortUrl,originUrl,description) {
  editingUrl=fullShortUrl; document.getElementById('modalTitle').textContent='编辑短链接';
  document.forms.linkForm.originUrl.value=originUrl;
  document.forms.linkForm.description.value=description||'';
  document.forms.linkForm.validDateType.value='0'; document.getElementById('validDateGroup').style.display='none';
  document.getElementById('linkModal').classList.add('show');
}
function closeModal(){document.getElementById('linkModal').classList.remove('show');}
async function fetchTitle() {
  var url = document.forms.linkForm.originUrl.value.trim();
  if (!url) return toast('请先输入链接','error');
  try {
    var r = await fetch(BASE+'/title?url='+encodeURIComponent(url),{headers:hdrs()});
    var j = await r.json();
    if (j.code==='0' && j.data) { document.forms.linkForm.description.value = j.data; toast('标题已获取','success'); }
    else toast('未获取到标题','info');
  } catch(e) { toast('网络错误','error'); }
}
document.getElementById('linkForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  var body={originUrl:this.originUrl.value, gid:currentGid, validDateType:parseInt(this.validDateType.value), description:this.description.value};
  if(body.validDateType===1&&this.validDate.value) body.validDate=this.validDate.value;
  if(editingUrl) body.fullShortUrl=editingUrl;
  var url=editingUrl?BASE+'/update':BASE+'/create', method=editingUrl?'PUT':'POST';
  try {
    var r=await fetch(url,{method,headers:hdrs(),body:JSON.stringify(body)}); var j=await r.json();
    if(j.code==='0'){toast(editingUrl?'修改成功':'创建成功','success');closeModal();loadLinks();}
    else toast(j.message||'操作失败','error');
  }catch(e){toast('网络错误','error');}
});
document.forms.linkForm.validDateType.addEventListener('change', function() { document.getElementById('validDateGroup').style.display=this.value==='1'?'block':'none'; });
async function removeLink(fullShortUrl) {
  if(!confirm('确定删除该短链接？（移入回收站）')) return;
  try {
    var r=await fetch(BASE+'/remove',{method:'DELETE',headers:hdrs(),body:JSON.stringify({gid:currentGid,fullShortUrl})});
    var j=await r.json();
    if(j.code==='0'){toast('已移入回收站','success');loadLinks();}
    else toast(j.message||'删除失败','error');
  }catch(e){toast('网络错误','error');}
}
// ================ recycle bin ================
async function loadRecycle() {
  document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px;color:var(--text2);">加载中...</div>';
  try {
    var r=await fetch(BASE+'/recycle-bin/page?current='+recyclePage+'&size=10',{headers:hdrs()}); var j=await r.json();
    if(j.code==='0'){recycleHasMore=j.data.length>=10;renderRecycle(j.data);}
    else document.getElementById('content').innerHTML='<div class="empty-state"><p>加载失败</p></div>';
  }catch(e){document.getElementById('content').innerHTML='<div class="empty-state"><p>网络错误</p></div>';}
}
function renderRecycle(items) {
  var h='<div class="toolbar"><h3>回收站</h3></div>';
  if(!items||!items.length){h+='<div class="empty-state"><p>回收站为空</p></div>';document.getElementById('content').innerHTML=h;return;}
  h+='<div class="card"><table><thead><tr><th>短链接</th><th>原始链接</th><th>分组</th><th style="width:120px">操作</th></tr></thead><tbody>';
  items.forEach(function(l){
    h+='<tr><td class="url">'+esc(l.fullShortUrl)+'</td><td class="origin" title="'+esc(l.originUrl)+'">'+esc(l.originUrl||'-')+'</td><td>'+esc(l.gid||'-')+'</td>'
      +'<td class="actions-cell"><button onclick="recoverLink(\''+escQ(l.fullShortUrl)+'\',\''+escQ(l.gid||'')+'\')">恢复</button><button class="danger" onclick="permDelete(\''+escQ(l.fullShortUrl)+'\',\''+escQ(l.gid||'')+'\')">彻底删除</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="pagination"><button onclick="recycleGo('+(recyclePage-1)+')" '+(recyclePage<=1?'disabled':'')+'>上一页</button><span class="page-num">第 '+recyclePage+' 页</span><button onclick="recycleGo('+(recyclePage+1)+')" '+(!recycleHasMore?'disabled':'')+'>下一页</button></div>';
  document.getElementById('content').innerHTML=h;
}
function recycleGo(p){if(p<1)return;recyclePage=p;loadRecycle();}
async function recoverLink(fullShortUrl,gid) {
  if(!confirm('确定恢复该短链接？')) return;
  try {
    var r=await fetch(BASE+'/recycle-bin/recover',{method:'POST',headers:hdrs(),body:JSON.stringify({fullShortUrl,gid})});
    var j=await r.json();
    if(j.code==='0'){toast('已恢复','success');loadRecycle();loadGroups();}
    else toast(j.message||'恢复失败','error');
  }catch(e){toast('网络错误','error');}
}
async function permDelete(fullShortUrl,gid) {
  if(!confirm('确定永久删除？此操作不可恢复！')) return;
  try {
    var r=await fetch(BASE+'/recycle-bin/delete',{method:'DELETE',headers:hdrs(),body:JSON.stringify({fullShortUrl,gid})});
    var j=await r.json();
    if(j.code==='0'){toast('已永久删除','success');loadRecycle();}
    else toast(j.message||'删除失败','error');
  }catch(e){toast('网络错误','error');}
}
// ================ access log drawer ================
function openLogs(fullShortUrl,gid){logShortUrl=fullShortUrl;logGid=gid;logPage=1;document.getElementById('drawerOverlay').classList.add('show');document.getElementById('drawer').classList.add('show');loadLogs();}
function closeDrawer(){document.getElementById('drawerOverlay').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
async function loadLogs() {
  document.getElementById('drawerBody').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2);">加载中...</div>';
  try {
    var body = {fullShortUrl:logShortUrl,gid:logGid,current:logPage,size:10};
    if(logStart) body.startDate = logStart;
    if(logEnd) body.endDate = logEnd;
    var r=await fetch(BASE+'/stats/access-record',{method:'POST',headers:hdrs(),body:JSON.stringify(body)});
    var j=await r.json();
    if(j.code==='0'){logHasMore=j.data.length>=10;renderLogs(j.data);}
    else document.getElementById('drawerBody').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2);">'+(j.message||'加载失败')+'</div>';
  }catch(e){document.getElementById('drawerBody').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2);">网络错误</div>';}
}
function renderLogs(logs) {
  var h='<p style="font-size:13px;color:var(--text2);margin-bottom:12px;">短链接: <code style="color:var(--primary)">'+esc(logShortUrl)+'</code></p>';
  if(!logs||!logs.length){h+='<div style="text-align:center;padding:40px;color:var(--text2);">暂无访问记录</div>';document.getElementById('drawerBody').innerHTML=h;document.getElementById('drawerPager').innerHTML='';return;}
  h+='<table><thead><tr><th>IP</th><th>浏览器</th><th>操作系统</th><th>设备</th><th>网络</th><th>地区</th></tr></thead><tbody>';
  logs.forEach(function(l){
    h+='<tr><td>'+esc(l.ip||'-')+'</td><td>'+esc(l.browser||'-')+'</td><td>'+esc(l.os||'-')+'</td><td>'+esc(l.device||'-')+'</td><td>'+esc(l.network||'-')+'</td><td>'+esc(l.locale||'-')+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('drawerBody').innerHTML=h;
  document.getElementById('drawerPager').innerHTML='<button onclick="logGo('+(logPage-1)+')" '+(logPage<=1?'disabled':'')+'>上一页</button><span style="margin:0 8px;font-size:13px;">第 '+logPage+' 页</span><button onclick="logGo('+(logPage+1)+')" '+(!logHasMore?'disabled':'')+'>下一页</button>';
}
function logGo(p){if(p<1||p===logPage&&!logHasMore)return;logPage=p;loadLogs();}
function logFilter(){logStart=document.getElementById('logStart').value;logEnd=document.getElementById('logEnd').value;logPage=1;loadLogs();}
function logReset(){document.getElementById('logStart').value='';document.getElementById('logEnd').value='';logStart='';logEnd='';logPage=1;loadLogs();}
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
// ================ modal overlay click ================
document.getElementById('linkModal').addEventListener('click',function(e){if(e.target===this) closeModal();});
// ================ stats ================
var chartJsLoaded = false;
function openStats(fullShortUrl, gid) {
  statsShortUrl = fullShortUrl; statsGid = gid;
  document.getElementById('statsOverlay').classList.add('show');
  document.getElementById('statsLinkUrl').textContent = fullShortUrl;
  if (chartJsLoaded) { statsPreset(7, document.querySelector('#statsToolbar .preset-btn')); return; }
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
  script.onload = function() { chartJsLoaded = true; statsPreset(7, document.querySelector('#statsToolbar .preset-btn')); };
  script.onerror = function() { document.getElementById('statsBody').innerHTML = '<div class="stats-loading">图表库加载失败，请检查网络连接</div>'; };
  document.head.appendChild(script);
}
function closeStats() {
  document.getElementById('statsOverlay').classList.remove('show');
  statsCharts.forEach(function(c) { c.destroy(); });
  statsCharts = [];
}
function statsPreset(days, btn) {
  document.querySelectorAll('#statsToolbar .preset-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var end = new Date(); var start = new Date();
  start.setDate(start.getDate() - days + 1);
  document.getElementById('statsStart').value = start.toISOString().split('T')[0];
  document.getElementById('statsEnd').value = end.toISOString().split('T')[0];
  loadStats();
}
function statsCustom() {
  document.querySelectorAll('#statsToolbar .preset-btn').forEach(function(b) { b.classList.remove('active'); });
  var s = document.getElementById('statsStart').value, e = document.getElementById('statsEnd').value;
  if (!s || !e) { toast('请选择起止日期','error'); return; }
  loadStats();
}
async function loadStats() {
  var body = { gid: statsGid, fullShortUrl: statsShortUrl,
    startDate: document.getElementById('statsStart').value,
    endDate: document.getElementById('statsEnd').value };
  statsCharts.forEach(function(c) { c.destroy(); });
  statsCharts = [];
  document.getElementById('statsBody').innerHTML = '<div class="stats-loading">加载中...</div>';
  try {
    var dims = [
      { key: 'locale', title: '地区分布' },
      { key: 'os', title: '操作系统' },
      { key: 'browser', title: '浏览器' },
      { key: 'device', title: '设备类型' },
      { key: 'network', title: '网络类型' }
    ];
    var r = await fetch(BASE+'/stats/dashboard', {method:'POST',headers:hdrs(),body:JSON.stringify(body)});
    var j = await r.json();
    var results = (j.code==='0' && j.data) ? j.data : {};
    renderStats(dims, results);
  } catch(e) { document.getElementById('statsBody').innerHTML = '<div class="stats-loading">加载失败: '+esc(e.message)+'</div>'; }
}
var CHART_COLORS = ['#4f46e5','#f59e0b','#22c55e','#ef4444','#06b6d4','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1'];
function makeDonut(ctx, labels, values) {
  if (typeof Chart === 'undefined') return null;
  return new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values, backgroundColor: CHART_COLORS, borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { boxWidth: 10, padding: 8, font: { size: 11 } } } } } });
}
function renderStats(dims, results) {
  var h = '<div class="stats-grid">';
  var hasData = false;
  dims.forEach(function(d, i) {
    var data = results[d.key] || [];
    if (data.length > 0) hasData = true;
    h += '<div class="chart-card"><h4>'+d.title+'</h4>';
    if (data.length > 0) {
      h += '<canvas id="chart'+i+'"></canvas>';
    } else {
      h += '<div class="stats-empty">暂无数据</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  // access line chart
  var accData = results.access || [];
  h += '<div class="stats-row-full"><div class="chart-card"><h4>访问趋势 (PV / UV / UIP)</h4>';
  if (accData.length > 0) {
    hasData = true;
    h += '<canvas id="chartAccess"></canvas>';
  } else {
    h += '<div class="stats-empty">暂无数据</div>';
  }
  h += '</div></div>';
  document.getElementById('statsBody').innerHTML = h;
  if (!hasData) { document.getElementById('statsBody').innerHTML = '<div class="stats-empty" style="padding:80px;">该时间段暂无统计数据</div>'; return; }
  // render donut charts
  dims.forEach(function(d, i) {
    var data = results[d.key] || [];
    if (data.length > 0) {
      var labels = data.map(function(item) { return item.name || '未知'; });
      var values = data.map(function(item) { return item.value || 0; });
      var ctx = document.getElementById('chart'+i);
      if (ctx) statsCharts.push(makeDonut(ctx, labels, values));
    }
  });
  // render access line chart
  if (accData.length > 0) {
    var dates = accData.map(function(item) { return item.date || ''; });
    var pvs = accData.map(function(item) { return item.pv || 0; });
    var uvs = accData.map(function(item) { return item.uv || 0; });
    var uips = accData.map(function(item) { return item.uip || 0; });
    var ctx2 = document.getElementById('chartAccess');
    if (ctx2) {
      if (typeof Chart !== 'undefined') statsCharts.push(new Chart(ctx2, { type: 'line', data: { labels: dates, datasets: [
        { label: 'PV', data: pvs, borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,.08)', fill: true, tension: .3, pointRadius: 3 },
        { label: 'UV', data: uvs, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,.08)', fill: true, tension: .3, pointRadius: 3 },
        { label: 'UIP', data: uips, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,.08)', fill: true, tension: .3, pointRadius: 3 }
      ]}, options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { boxWidth: 12, padding: 12, font: { size: 11 } } } },
        scales: { y: { beginAtZero: true, ticks: { font: { size: 11 } } }, x: { ticks: { font: { size: 10 } } } }
      } }));
    }
  }
}
document.getElementById('statsOverlay').addEventListener('click', function(e) { if (e.target === this) closeStats(); });
// ================ init ================
restoreSession();
</script>
</body>
</html>
