locale:
  gaoDe:
    apiKey: e9dc0d95166eccdd3290a2074d406fad

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  data:
    redis:
      host: localhost
      port: 6379
  mvc:
    view:
      prefix: /templates/
      suffix: .html

  profiles:
    active: dev
---
spring:
  config:
    activate:
      on-profile: dev
server:
  port: 8082
---
spring:
  config:
    activate:
      on-profile: test
server:
  port: 8088
