server:
  port: 8083

spring:
  application:
    name: shortlink-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: shortlink-admin
          uri: lb://shortlink-admin
          predicates:
            - Path=/api/short-link/admin/**
        - id: shortlink-project
          uri: lb://shortlink-project
          predicates:
            - Path=/api/short-link/**
        - id: shortlink-redirect
          uri: lb://shortlink-project
          predicates:
            - Path=/**
  data:
    redis:
      host: localhost
      port: 6379
  short-link:
    white-list:
      /api/short-link/admin/v1/user/login,
      /api/short-link/admin/v1/user/has-username,
      /api/short-link/admin/v1/test,
      /doc.html,
      /swagger-ui/**,
      /v3/**,
      /webjars/**